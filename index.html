<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASE DB Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: white; padding: 20px 32px; display: flex; align-items: center; gap: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  header span { font-size: 12px; opacity: 0.6; margin-left: auto; }

  .main { display: grid; grid-template-columns: 340px 1fr; gap: 0; min-height: calc(100vh - 64px); }

  /* LEFT PANEL */
  .left { background: #fff; border-right: 1px solid #e2e6ea; display: flex; flex-direction: column; }

  .panel-title {
    padding: 16px 20px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: #6c757d; border-bottom: 1px solid #f0f2f5;
  }

  /* Data Editor */
  .data-editor { padding: 16px 20px; border-bottom: 2px solid #f0f2f5; }
  .data-editor label { font-size: 11px; font-weight: 600; color: #495057; display: block; margin-bottom: 6px; }
  .data-editor textarea {
    width: 100%; height: 180px; border: 1px solid #dee2e6; border-radius: 6px;
    font-family: 'Consolas', monospace; font-size: 11px; padding: 10px;
    resize: vertical; background: #f8f9fa; color: #212529; line-height: 1.5;
  }
  .data-editor textarea:focus { outline: none; border-color: #0f3460; background: #fff; }
  .btn-parse {
    margin-top: 8px; width: 100%; padding: 9px; background: #0f3460; color: #fff;
    border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background 0.2s;
  }
  .btn-parse:hover { background: #1a5276; }

  /* Filter Panel */
  .filter-panel { padding: 16px 20px; flex: 1; overflow-y: auto; }

  .filter-section { margin-bottom: 20px; }
  .filter-section h4 { font-size: 11px; font-weight: 700; color: #6c757d; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }

  .search-box {
    width: 100%; padding: 8px 12px; border: 1px solid #dee2e6; border-radius: 6px;
    font-size: 12px; background: #f8f9fa;
  }
  .search-box:focus { outline: none; border-color: #0f3460; background: #fff; }

  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    cursor: pointer; border: 1.5px solid #dee2e6; background: #f8f9fa; color: #495057;
    transition: all 0.15s;
  }
  .chip:hover { border-color: #0f3460; color: #0f3460; }
  .chip.active { background: #0f3460; color: #fff; border-color: #0f3460; }
  .chip.base-chip.active { background: #e74c3c; border-color: #e74c3c; }

  /* RIGHT PANEL */
  .right { display: flex; flex-direction: column; overflow: hidden; }

  /* Tabs */
  .tabs { display: flex; background: #fff; border-bottom: 2px solid #e2e6ea; padding: 0 24px; }
  .tab {
    padding: 14px 20px; font-size: 12px; font-weight: 600; color: #6c757d;
    cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: all 0.15s; letter-spacing: 0.3px;
  }
  .tab.active { color: #0f3460; border-bottom-color: #0f3460; }
  .tab:hover:not(.active) { color: #495057; }

  .tab-content { flex: 1; overflow: auto; padding: 24px; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* Timeline View */
  .timeline-table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 8px rgba(0,0,0,0.07); }
  .timeline-table th {
    background: #1a1a2e; color: #fff; padding: 12px 14px; font-size: 11px;
    font-weight: 600; text-align: left; letter-spacing: 0.5px; white-space: nowrap;
  }
  .timeline-table td {
    padding: 12px 14px; border-bottom: 1px solid #f0f2f5; font-size: 12px;
    vertical-align: top; line-height: 1.5;
  }
  .timeline-table tr:last-child td { border-bottom: none; }
  .timeline-table tr:hover td { background: #f8f9fa; }

  .rev-badge {
    display: inline-block; padding: 3px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 700; background: #e8f4fd; color: #0f3460;
    white-space: nowrap;
  }
  .date-text { color: #6c757d; font-size: 11px; white-space: nowrap; }

  .base-badge {
    display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap;
  }
  .base-tag {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 700; background: #fdecea; color: #c0392b;
    white-space: nowrap;
  }

  .temp-list { display: flex; flex-direction: column; gap: 4px; }
  .temp-item {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 6px; font-size: 11px;
    font-weight: 600; width: fit-content;
  }
  /* 신규: 강조 초록 실선 */
  .temp-item.new-rule { background: #1e7e34; color: #ffffff; border: 1.5px solid #1e7e34; }
  /* 이월: 눈에 안띄는 회색 */
  .temp-item.carried-rule { background: #f0f0f0; color: #adb5bd; border: 1.5px dashed #ced4da; }
  .temp-item.highlighted { background: #fff3cd; color: #856404; border: 1.5px solid #856404; }

  /* 범례 */
  .legend { display: flex; gap: 16px; align-items: center; padding: 0 0 14px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #495057; }
  .legend-box {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
  }
  .legend-box.new-rule { background: #1e7e34; color: #ffffff; border: 1.5px solid #1e7e34; }
  .legend-box.carried-rule { background: #f0f0f0; color: #adb5bd; border: 1.5px dashed #ced4da; }

  .content-cell { font-size: 11px; color: #495057; }
  .content-item { padding: 2px 0; }
  .content-item.highlighted { color: #856404; font-weight: 600; }

  /* Rule Tracker View */
  .tracker-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .tracker-header h3 { font-size: 14px; font-weight: 700; color: #1a1a2e; }

  .rule-card {
    background: #fff; border-radius: 10px; box-shadow: 0 1px 8px rgba(0,0,0,0.07);
    margin-bottom: 16px; overflow: hidden; border-left: 4px solid #0f3460;
  }
  .rule-card.inactive { border-left-color: #adb5bd; opacity: 0.75; }
  .rule-card-header {
    padding: 14px 20px; display: flex; align-items: center; gap: 12px;
    background: #f8f9fa; border-bottom: 1px solid #e9ecef;
  }
  .rule-name { font-size: 14px; font-weight: 700; color: #1a1a2e; }
  .rule-desc { font-size: 12px; color: #6c757d; margin-left: auto; }
  .status-badge {
    padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700;
  }
  .status-badge.active { background: #d4edda; color: #155724; }
  .status-badge.inactive { background: #e2e3e5; color: #6c757d; }

  .rule-timeline { padding: 16px 20px; }
  .rule-timeline h5 { font-size: 10px; font-weight: 700; color: #6c757d; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }

  .rev-track { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 4px; }
  .rev-node {
    display: flex; flex-direction: column; align-items: center; min-width: 72px;
  }
  .rev-dot {
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 700; z-index: 1; flex-shrink: 0;
  }
  .rev-dot.has-rule { background: #0f3460; color: #fff; box-shadow: 0 0 0 3px #c8d8f0; }
  .rev-dot.no-rule { background: #e9ecef; color: #adb5bd; }
  .rev-dot.origin { background: #e74c3c; color: #fff; box-shadow: 0 0 0 3px #f5b7b1; }

  .rev-label { font-size: 10px; color: #6c757d; margin-top: 5px; text-align: center; }
  .rev-connector {
    height: 3px; flex: 1; align-self: center; margin-top: -16px;
  }
  .rev-connector.active-line { background: #0f3460; }
  .rev-connector.inactive-line { background: #dee2e6; }

  .rule-bases { margin-top: 10px; font-size: 11px; color: #495057; }
  .rule-bases span { font-weight: 600; color: #0f3460; }

  /* Build Result View */
  .build-controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .build-controls label { font-size: 12px; font-weight: 600; color: #495057; }
  .build-controls select {
    padding: 8px 12px; border: 1px solid #dee2e6; border-radius: 6px;
    font-size: 12px; background: #fff; min-width: 120px;
  }
  .btn-build {
    padding: 8px 20px; background: #27ae60; color: #fff; border: none;
    border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background 0.2s;
  }
  .btn-build:hover { background: #229954; }

  .build-result {
    background: #fff; border-radius: 10px; box-shadow: 0 1px 8px rgba(0,0,0,0.07);
    padding: 24px; min-height: 200px;
  }
  .build-result h4 { font-size: 13px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
  .build-result .sub { font-size: 11px; color: #6c757d; margin-bottom: 20px; }

  .build-section { margin-bottom: 16px; }
  .build-section h5 {
    font-size: 10px; font-weight: 700; color: #6c757d; text-transform: uppercase;
    letter-spacing: 0.8px; margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid #f0f2f5;
  }
  .build-rule-row {
    display: flex; align-items: flex-start; gap: 12px; padding: 8px 0;
    border-bottom: 1px solid #f8f9fa;
  }
  .build-rule-row:last-child { border-bottom: none; }
  .build-rule-id { font-size: 11px; font-weight: 700; color: #0f3460; min-width: 110px; }
  .build-rule-content { font-size: 12px; color: #495057; }
  .build-rule-origin { font-size: 10px; color: #e74c3c; font-weight: 600; }

  .empty-state { text-align: center; padding: 60px 20px; color: #adb5bd; }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; }

  .no-results { text-align: center; padding: 40px; color: #adb5bd; font-size: 13px; }

  /* Diff badge */
  .diff-badge {
    display: inline-block; padding: 2px 7px; border-radius: 10px;
    font-size: 10px; font-weight: 700; margin-left: 6px;
  }
  .diff-badge.new { background: #d4edda; color: #155724; }
  .diff-badge.carried { background: #e8f4fd; color: #0c5460; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🗂 BASE DB Tracker</h1>
  </div>
  <span>BASE-grouped Cumulative Build</span>
</header>

<div class="main">
  <!-- LEFT -->
  <div class="left">
    <div class="panel-title">데이터 입력 / 필터</div>

    <div class="data-editor">
      <label>📋 History 데이터 붙여넣기 (탭 구분)</label>
      <textarea id="rawInput" placeholder="Rev번호&#9;날짜&#9;TEMP 적용&#9;TEMP 내용&#9;BASE
R03&#9;260103&#9;TEMP03_DR&#9;DC max_length 예외&#9;R03
R04&#9;260303&#9;TEMP03_DR+TEMP04_DR&#9;DC max_length 예외+GP max_length 예외&#9;R03+R04
R05&#9;260503&#9;TEMP03_DR+TEMP05_DR&#9;DC max_length 예외+IIP overlap 예외&#9;R03+R05"></textarea>
      <button class="btn-parse" onclick="parseData()">▶ 데이터 로드</button>
    </div>

    <div class="filter-panel">
      <div class="filter-section">
        <h4>🔍 TEMP Rule 검색</h4>
        <input class="search-box" id="ruleSearch" type="text" placeholder="Rule ID 또는 내용 검색..." oninput="applyFilters()">
      </div>
      <div class="filter-section">
        <h4>📌 Library 필터</h4>
        <div class="chip-group" id="revChips"></div>
      </div>
      <div class="filter-section">
        <h4>🧱 BASE 필터</h4>
        <div class="chip-group" id="baseChips"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('timeline', this)">📅 BASE DB 타임라인</div>
      <div class="tab" onclick="switchTab('tracker', this)">🔎 Rule 추적</div>
      <div class="tab" onclick="switchTab('build', this)">⚙️ 누적 빌드</div>
    </div>

    <div class="tab-content">
      <!-- TIMELINE TAB -->
      <div class="tab-pane active" id="tab-timeline">
        <div id="timelineContainer">
          <div class="empty-state">
            <div class="icon">📋</div>
            <p>좌측에 데이터를 붙여넣고 [데이터 로드]를 클릭하세요</p>
          </div>
        </div>
      </div>

      <!-- TRACKER TAB -->
      <div class="tab-pane" id="tab-tracker">
        <div class="tracker-header">
          <h3>TEMP Rule별 적용 Rev 추적</h3>
        </div>
        <div id="trackerContainer">
          <div class="empty-state">
            <div class="icon">🔍</div>
            <p>데이터를 로드하면 각 TEMP rule의 적용 이력이 표시됩니다</p>
          </div>
        </div>
      </div>

      <!-- BUILD TAB -->
      <div class="tab-pane" id="tab-build">
        <div class="build-controls">
          <label>대상 Rev 선택:</label>
          <select id="buildRevSelect">
            <option value="">-- Rev 선택 --</option>
          </select>
          <button class="btn-build" onclick="runBuild()">⚙️ 누적 빌드 실행</button>
        </div>
        <div class="build-result" id="buildResult">
          <div class="empty-state">
            <div class="icon">⚙️</div>
            <p>Rev를 선택하고 빌드를 실행하면 해당 시점의 누적 TEMP rule이 표시됩니다</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let allData = [];
let filteredData = [];
let activeRevFilter = null;
let activeBaseFilter = null;

// ── Parse ──────────────────────────────────────────
function parseData() {
  const raw = document.getElementById('rawInput').value.trim();
  if (!raw) return;

  const lines = raw.split('\n').filter(l => l.trim());
  const parsed = [];

  for (const line of lines) {
    const cols = line.split('\t').map(c => c.trim());
    if (cols.length < 5) continue;
    const [rev, date, tempApplied, tempContent, base] = cols;
    if (rev.toLowerCase() === 'rev번호' || rev.toLowerCase() === 'rev') continue;

    const temps = tempApplied.split(/\+/).map(t => t.trim()).filter(Boolean);
    const contents = tempContent.split(/\+/).map(c => c.trim()).filter(Boolean);
    const bases = base.split(/\+/).map(b => b.trim()).filter(Boolean);

    parsed.push({ rev, date, temps, contents, bases, raw: { tempApplied, tempContent, base } });
  }

  allData = parsed;
  filteredData = [...allData];
  buildChips();
  populateBuildSelect();
  renderAll();
}

// ── Chips ──────────────────────────────────────────
function buildChips() {
  const revs = [...new Set(allData.map(d => d.rev))];
  const bases = [...new Set(allData.flatMap(d => d.bases))];

  document.getElementById('revChips').innerHTML =
    `<div class="chip active" onclick="filterRev(null, this)">전체</div>` +
    revs.map(r => `<div class="chip" onclick="filterRev('${r}', this)">${r}</div>`).join('');

  document.getElementById('baseChips').innerHTML =
    `<div class="chip active" onclick="filterBase(null, this)">전체</div>` +
    bases.map(b => `<div class="chip base-chip" onclick="filterBase('${b}', this)">${b}</div>`).join('');
}

function filterRev(rev, el) {
  activeRevFilter = rev;
  document.querySelectorAll('#revChips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function filterBase(base, el) {
  activeBaseFilter = base;
  document.querySelectorAll('#baseChips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const search = document.getElementById('ruleSearch').value.toLowerCase();
  filteredData = allData.filter(d => {
    const revOk = !activeRevFilter || d.rev === activeRevFilter;
    const baseOk = !activeBaseFilter || d.bases.includes(activeBaseFilter);
    const searchOk = !search ||
      d.temps.some(t => t.toLowerCase().includes(search)) ||
      d.contents.some(c => c.toLowerCase().includes(search)) ||
      d.rev.toLowerCase().includes(search);
    return revOk && baseOk && searchOk;
  });
  renderAll();
}

function populateBuildSelect() {
  const sel = document.getElementById('buildRevSelect');
  sel.innerHTML = '<option value="">-- Rev 선택 --</option>' +
    allData.map(d => `<option value="${d.rev}">${d.rev} (${d.date})</option>`).join('');
}

// ── Render ─────────────────────────────────────────
function renderAll() {
  renderTimeline();
  renderTracker();
}

function renderTimeline() {
  const search = document.getElementById('ruleSearch').value.toLowerCase();
  if (!filteredData.length) {
    document.getElementById('timelineContainer').innerHTML =
      '<div class="no-results">필터 조건에 맞는 데이터가 없습니다</div>';
    return;
  }

  // 전체 데이터 기준으로 각 TEMP의 최초 등장 Rev 계산
  const firstSeen = {};
  for (const d of allData) {
    for (const t of d.temps) {
      if (!firstSeen[t]) firstSeen[t] = d.rev;
    }
  }

  const rows = filteredData.map(d => {
    const baseHtml = d.bases.map(b => `<span class="base-tag">${b}</span>`).join(' ');
    const tempHtml = d.temps.map((t, i) => {
      const hl = search && t.toLowerCase().includes(search);
      if (hl) return `<div class="temp-item highlighted">${t}</div>`;
      const isNew = firstSeen[t] === d.rev;
      const cls = isNew ? 'new-rule' : 'carried-rule';
      const label = isNew ? '🆕' : '🔄';
      return `<div class="temp-item ${cls}">${label} ${t}</div>`;
    }).join('');
    const contentHtml = d.contents.map((c, i) => {
      const hl = search && c.toLowerCase().includes(search);
      return `<div class="content-item${hl ? ' highlighted' : ''}">${c}</div>`;
    }).join('');

    return `<tr>
      <td><span class="rev-badge">${d.rev}</span></td>
      <td><span class="date-text">${formatDate(d.date)}</span></td>
      <td><div class="base-badge">${baseHtml}</div></td>
      <td><div class="temp-list">${tempHtml}</div></td>
      <td><div class="content-cell">${contentHtml}</div></td>
    </tr>`;
  }).join('');

  const legend = `
    <div class="legend">
      <span style="font-size:11px;font-weight:700;color:#495057;">범례:</span>
      <div class="legend-item"><span class="legend-box new-rule">🆕 신규</span> 해당 Rev에서 처음 적용</div>
      <div class="legend-item"><span class="legend-box carried-rule">🔄 이월</span> 이전 Rev에서 가져온 TEMP</div>
    </div>`;

  document.getElementById('timelineContainer').innerHTML = legend + `
    <table class="timeline-table">
      <thead>
        <tr>
          <th>Rev</th><th>날짜</th><th>BASE</th><th>TEMP 적용</th><th>내용</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderTracker() {
  const search = document.getElementById('ruleSearch').value.toLowerCase();
  const allRevs = allData.map(d => d.rev);

  // 모든 unique TEMP rule 수집
  const ruleMap = {};
  for (const d of allData) {
    d.temps.forEach((t, i) => {
      if (!ruleMap[t]) ruleMap[t] = { name: t, desc: d.contents[i] || '', revs: [], bases: new Set() };
      ruleMap[t].revs.push(d.rev);
      d.bases.forEach(b => ruleMap[t].bases.add(b));
    });
  }

  // Filter
  let rules = Object.values(ruleMap);
  if (search) rules = rules.filter(r => r.name.toLowerCase().includes(search) || r.desc.toLowerCase().includes(search));

  if (!rules.length) {
    document.getElementById('trackerContainer').innerHTML =
      '<div class="no-results">검색 결과가 없습니다</div>';
    return;
  }

  const cards = rules.map(rule => {
    const isActive = rule.revs.includes(allRevs[allRevs.length - 1]);
    const originRev = rule.revs[0];

    // Build timeline dots
    const dots = [];
    for (let i = 0; i < allRevs.length; i++) {
      const rev = allRevs[i];
      const hasRule = rule.revs.includes(rev);
      const isOrigin = rev === originRev;
      const dotClass = isOrigin ? 'origin' : hasRule ? 'has-rule' : 'no-rule';

      dots.push(`<div class="rev-node">
        <div class="rev-dot ${dotClass}">${rev.replace('R','R')}</div>
        <div class="rev-label">${rev}</div>
      </div>`);

      if (i < allRevs.length - 1) {
        const nextRev = allRevs[i + 1];
        const nextHas = rule.revs.includes(nextRev);
        const lineClass = hasRule && nextHas ? 'active-line' : 'inactive-line';
        dots.push(`<div class="rev-connector ${lineClass}"></div>`);
      }
    }

    const basesArr = [...rule.bases];

    return `<div class="rule-card ${isActive ? '' : 'inactive'}">
      <div class="rule-card-header">
        <div class="rule-name">${rule.name}</div>
        <div class="rule-desc">${rule.desc}</div>
        <span class="status-badge ${isActive ? 'active' : 'inactive'}">${isActive ? '✅ 현재 적용' : '⏸ 미적용'}</span>
      </div>
      <div class="rule-timeline">
        <h5>적용 Rev 이력</h5>
        <div class="rev-track">${dots.join('')}</div>
        <div class="rule-bases" style="margin-top:10px">
          관련 BASE: <span>${basesArr.join(', ')}</span>
          &nbsp;|&nbsp; 최초 도입: <span>${originRev}</span>
          &nbsp;|&nbsp; 적용 횟수: <span>${rule.revs.length}회</span>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('trackerContainer').innerHTML = cards;
}

// ── Build ──────────────────────────────────────────
function runBuild() {
  const targetRev = document.getElementById('buildRevSelect').value;
  if (!targetRev) return;

  const targetData = allData.find(d => d.rev === targetRev);
  if (!targetData) return;

  // BASE가 같은 Rev 찾기 (targetRev까지)
  const targetBases = new Set(targetData.bases);
  const targetIdx = allData.findIndex(d => d.rev === targetRev);

  // 누적: targetRev 이전(포함)에서 BASE 교집합이 있는 항목들
  const accumulated = {};
  const revOrder = [];

  for (let i = 0; i <= targetIdx; i++) {
    const d = allData[i];
    const sharedBase = d.bases.some(b => targetBases.has(b));
    if (!sharedBase) continue;

    revOrder.push(d.rev);
    d.temps.forEach((t, idx) => {
      const isNew = !accumulated[t];
      accumulated[t] = {
        id: t,
        content: d.contents[idx] || '',
        origin: d.rev,
        isNew
      };
    });
  }

  const rules = Object.values(accumulated);
  const newRules = rules.filter(r => r.origin === targetRev);
  const carried = rules.filter(r => r.origin !== targetRev);

  const makeRows = list => list.map(r =>
    `<div class="build-rule-row">
      <div>
        <div class="build-rule-id">${r.id}</div>
        <div class="build-rule-origin">from ${r.origin}</div>
      </div>
      <div class="build-rule-content">${r.content}</div>
    </div>`
  ).join('');

  document.getElementById('buildResult').innerHTML = `
    <h4>⚙️ ${targetRev} 시점 누적 TEMP Rule 빌드 결과</h4>
    <div class="sub">
      BASE: ${[...targetBases].join(', ')} &nbsp;|&nbsp;
      누적 대상 Rev: ${revOrder.join(' → ')} &nbsp;|&nbsp;
      총 <strong>${rules.length}개</strong> rule
    </div>

    ${newRules.length ? `
    <div class="build-section">
      <h5>🆕 신규 추가 (${targetRev}) — ${newRules.length}개</h5>
      ${makeRows(newRules)}
    </div>` : ''}

    ${carried.length ? `
    <div class="build-section">
      <h5>📦 이전 Rev에서 이월 — ${carried.length}개</h5>
      ${makeRows(carried)}
    </div>` : ''}

    ${!rules.length ? '<div class="no-results">해당 시점에 적용된 TEMP rule이 없습니다</div>' : ''}
  `;
}

// ── Utils ──────────────────────────────────────────
function formatDate(d) {
  if (!d || d.length < 6) return d;
  return `20${d.slice(0,2)}-${d.slice(2,4)}-${d.slice(4,6)}`;
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}
